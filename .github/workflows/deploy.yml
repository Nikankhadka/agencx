name: Deploy (production)

# B-4: production verification, kept as a separate flow from CI (ci.yml is the
# development gate: lint/typecheck/test/eval on every push and PR).
#
# There is no build or push step here any more. Since B-4 the whole product is
# one Vercel project running two container services (vercel.json: frontend and
# backend, routed by rewrites), and Vercel's own Git integration builds and
# deploys both on every push to the production branch. A pipeline that also
# built them would be a second, slower copy of a deploy that already happened.
#
# What is left is the part Vercel does not do: proving the deployed origin is
# actually answering. This workflow waits for CI to go green on `staging` (the
# production branch) and then smoke-tests the live origin.
#
# The superseded AWS ECS path (infra/*.tf, T-035/T-036) is kept and dormant -
# validated by ci.yml's `infra` job so it cannot rot, deployed by nothing.
#
# Required repo secret:
#   SMOKE_TEST_BASE_URL - the production origin, e.g. https://agencx.vercel.app
#     Until it is set this workflow no-ops with a notice instead of failing,
#     the same pattern ci.yml's eval-gate uses for LLM_API_KEY.

permissions:
  contents: read

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [staging]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  smoke-test:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # The `secrets` context is not available in a job-level `if:`, so
      # readiness is computed in a step and every later step reads its output.
      - id: check
        env:
          HAS_BASE_URL: ${{ secrets.SMOKE_TEST_BASE_URL != '' }}
        run: |
          echo "ready=${HAS_BASE_URL}" >> "$GITHUB_OUTPUT"
          if [ "${HAS_BASE_URL}" != "true" ]; then
            echo "::notice::SMOKE_TEST_BASE_URL not set - skipping the production smoke test (see docs/agencx/deploy.md)"
          fi

      # Vercel promotes the new deployment asynchronously, so the origin can
      # still be serving the previous build for a few seconds after CI reports
      # green. Retry rather than race it.
      - name: Backend health
        if: steps.check.outputs.ready == 'true'
        env:
          BASE_URL: ${{ secrets.SMOKE_TEST_BASE_URL }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 20 "$BASE_URL/health"; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 10s"
            sleep 10
          done
          echo "::error::$BASE_URL/health never returned 200"
          exit 1

      # Proves more than liveness: this route reads the database and resolves a
      # tenant by slug, so a 200 means the pooled connection, the schema and
      # tenant resolution all survived the deploy. `bytefix` is the slug seeded
      # by backend/seeds/seed_tenant1_phoneshop.py (deploy.md step 1).
      - name: Seeded tenant resolves
        if: steps.check.outputs.ready == 'true'
        env:
          BASE_URL: ${{ secrets.SMOKE_TEST_BASE_URL }}
        run: curl -fsSL --max-time 20 "$BASE_URL/api/public/tenant/bytefix" > /dev/null

      # The customer page is the product's actual promise, and it is the surface
      # the rewrite rules are most likely to get wrong: it is served by the
      # frontend service while every path it fetches is served by the backend.
      - name: Customer page serves
        if: steps.check.outputs.ready == 'true'
        env:
          BASE_URL: ${{ secrets.SMOKE_TEST_BASE_URL }}
        run: curl -fsSL --max-time 30 "$BASE_URL/bytefix" > /dev/null
