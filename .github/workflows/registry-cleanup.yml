name: Container registry cleanup

# Vercel's container registry (VCR) caps at 50 images per repository on the
# hobby plan, and every deployment pushes a commit-SHA-tagged image that
# nothing ever deletes. A full repository fails every later deployment at the
# push step ("repository has reached the maximum allowed number of images"):
# it happened on 2026-09-03 and again from 2026-09-12 to 2026-09-30, when this
# workflow could not run without its secret.
#
# scripts/vcr_prune.py keeps the images live deployments run (the newest
# production and development deployments plus any build in flight) and deletes
# the rest. It fails loudly on error - this workflow guards the deploy lane.
#
# Required repo secret:
#   VERCEL_TOKEN - a token scoped to the project's team (the same kind of token
#     as .env.deploy.local's VERCEL_TOKEN). Until it is set this workflow fails
#     on purpose; `make vcr-prune-apply` runs the same prune by hand
#     (deploy.md, Step 6).

on:
  schedule:
    - cron: "0 4 * * *" # daily, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-cleanup
  cancel-in-progress: true

jobs:
  prune:
    runs-on: ubuntu-latest
    env:
      # Same values as the committed .vercel/project.json - not secrets.
      VERCEL_PROJECT: prj_wtY5nJsaSQERalmLNsjAIITDbcAU
      VERCEL_TEAM: team_nrEhsZUAzBz2XyL8eLM7l4gX
    steps:
      - uses: actions/checkout@v7
      - name: Prune images no live deployment runs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::VERCEL_TOKEN secret not set - add it in Settings > Secrets and variables (see docs/agencx/deploy.md, Step 6)"
            exit 1
          fi
          python3 scripts/vcr_prune.py --apply
